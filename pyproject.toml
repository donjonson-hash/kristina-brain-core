[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kristina-brain-core"
version = "0.9.0"
description = "Dual-timescale affective state, cognitive appraisal, proactive silence policy, and PII-free shadow telemetry engine for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ai-agents", "mcp", "affective-computing", "proactive-agents", "llm", "state-machine"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/donjonson-hash/kristina-brain-core"
Repository = "https://github.com/donjonson-hash/kristina-brain-core"
Issues = "https://github.com/donjonson-hash/kristina-brain-core/issues"

[project.optional-dependencies]
postgres = ["asyncpg>=0.29.0"]
cloud = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]
dev = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
brain-core-mcp = "kristina_brain.mcp_server:main"
brain-core-cloud = "kristina_brain.control_plane:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kristina_brain = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S105", "S106"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"src/kristina_brain/control_plane.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
